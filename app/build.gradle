plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.markb.wappushcrash'
    compileSdk 35
    defaultConfig {
        applicationId "com.markb.wappushcrash"
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
